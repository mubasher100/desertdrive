name: Deploy storefront

on:
  push:
    branches: [main]
    paths:
      - "apps/storefront/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-storefront.yml"
  workflow_dispatch:

concurrency:
  group: deploy-storefront
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Nothing is provisioned until the Cloudflare account and the Railway
      # backend exist. Rather than fail every push to main until then, check
      # first and skip with a notice — a red main that is red for a known and
      # expected reason trains people to ignore it.
      - name: Check deploy configuration
        id: config
        run: |
          missing=""
          [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "${{ secrets.MEDUSA_PUBLISHABLE_KEY }}" ] || missing="$missing MEDUSA_PUBLISHABLE_KEY"
          [ -n "${{ vars.MEDUSA_BACKEND_URL }}" ] || missing="$missing MEDUSA_BACKEND_URL(var)"
          [ -n "${{ vars.STOREFRONT_BASE_URL }}" ] || missing="$missing STOREFRONT_BASE_URL(var)"

          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Storefront deploy skipped::Not configured yet. Missing:$missing"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.config.outputs.ready == 'true'
        run: npm ci

      # `next build` statically generates pages that call the Store API, so this
      # step needs the LIVE Railway backend to be up. If it fails with
      # ECONNREFUSED, check the backend before suspecting the storefront.
      - name: Build for Cloudflare
        if: steps.config.outputs.ready == 'true'
        working-directory: apps/storefront
        run: npm run cf:build
        env:
          MEDUSA_BACKEND_URL: ${{ vars.MEDUSA_BACKEND_URL }}
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${{ secrets.MEDUSA_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_BASE_URL: ${{ vars.STOREFRONT_BASE_URL }}
          NEXT_PUBLIC_DEFAULT_REGION: qa
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          BOOKING_TOKEN_SECRET: ${{ secrets.BOOKING_TOKEN_SECRET }}

      # Plain `wrangler deploy`, not `opennextjs-cloudflare deploy`: the latter
      # first pre-populates the R2 cache through a temporary helper Worker, and
      # that step is both slow and fragile. Nothing user-visible depends on
      # pre-population — the cache fills on first request.
      - name: Deploy
        if: steps.config.outputs.ready == 'true'
        working-directory: apps/storefront
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Worker secrets are separate from build-time env. The booking-lookup
      # secret must match the backend's, or every email link says not found.
      - name: Set Worker secrets
        if: steps.config.outputs.ready == 'true'
        working-directory: apps/storefront
        run: printf '%s' "$BOOKING_TOKEN_SECRET" | npx wrangler secret put BOOKING_TOKEN_SECRET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BOOKING_TOKEN_SECRET: ${{ secrets.BOOKING_TOKEN_SECRET }}
