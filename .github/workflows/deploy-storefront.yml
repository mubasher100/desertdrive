name: Deploy storefront

on:
  push:
    branches: [main]
    paths:
      - "apps/storefront/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-storefront.yml"
  workflow_dispatch:

concurrency:
  group: deploy-storefront
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Nothing is provisioned until the Cloudflare account and the Railway
      # backend exist. Rather than fail every push to main until then, check
      # first and skip with a notice — a red main that is red for a known and
      # expected reason trains people to ignore it.
      - name: Check deploy configuration
        id: config
        run: |
          missing=""
          [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "${{ secrets.MEDUSA_PUBLISHABLE_KEY }}" ] || missing="$missing MEDUSA_PUBLISHABLE_KEY"
          [ -n "${{ vars.MEDUSA_BACKEND_URL }}" ] || missing="$missing MEDUSA_BACKEND_URL(var)"
          [ -n "${{ vars.STOREFRONT_BASE_URL }}" ] || missing="$missing STOREFRONT_BASE_URL(var)"

          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Storefront deploy skipped::Not configured yet. Missing:$missing"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.config.outputs.ready == 'true'
        run: npm ci

      # `next build` statically generates pages that call the Store API, so this
      # step needs the LIVE Railway backend to be up. If it fails with
      # ECONNREFUSED, check the backend before suspecting the storefront.
      - name: Build for Cloudflare
        if: steps.config.outputs.ready == 'true'
        working-directory: apps/storefront
        run: npm run cf:build
        env:
          MEDUSA_BACKEND_URL: ${{ vars.MEDUSA_BACKEND_URL }}
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${{ secrets.MEDUSA_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_BASE_URL: ${{ vars.STOREFRONT_BASE_URL }}
          NEXT_PUBLIC_DEFAULT_REGION: qa
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          BOOKING_TOKEN_SECRET: ${{ secrets.BOOKING_TOKEN_SECRET }}
          # The public base of the R2 bucket customer sign pictures go to.
          # Empty (the repo variable unset) hides the picture control and the
          # sign's text still works; set it and the next deploy turns it on.
          # Not a secret — it is printed in every page that shows a picture.
          NEXT_PUBLIC_UPLOADS_PUBLIC_URL: ${{ vars.UPLOADS_PUBLIC_URL }}

      # Remember what is live, so a deploy that breaks the site is put back
      # without anyone touching it (see "Check the live site" below). From
      # the Flowershop project.
      - name: Record the live version
        id: previous
        if: steps.config.outputs.ready == 'true'
        working-directory: apps/storefront
        run: |
          id=$(npx wrangler deployments status --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const v=JSON.parse(s).versions||[];const top=v.sort((a,b)=>b.percentage-a.percentage)[0];process.stdout.write(top?top.version_id:"")}catch{}})') || id=""
          echo "Live before this deploy: ${id:-unknown}"
          echo "version=$id" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Plain `wrangler deploy`, not `opennextjs-cloudflare deploy`: the latter
      # first pre-populates the R2 cache through a temporary helper Worker, and
      # that step is both slow and fragile. Nothing user-visible depends on
      # pre-population — the cache fills on first request.
      - name: Deploy
        if: steps.config.outputs.ready == 'true'
        working-directory: apps/storefront
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Worker secrets are separate from build-time env. The booking-lookup
      # secret must match the backend's, or every email link says not found.
      - name: Set Worker secrets
        if: steps.config.outputs.ready == 'true'
        working-directory: apps/storefront
        run: printf '%s' "$BOOKING_TOKEN_SECRET" | npx wrangler secret put BOOKING_TOKEN_SECRET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BOOKING_TOKEN_SECRET: ${{ secrets.BOOKING_TOKEN_SECRET }}

      # A Cloudflare deploy swaps versions atomically, so nobody sees half a
      # site — but a broken build reaches everyone at once. Walk the pages a
      # customer books through, past the cache, including a real fare; if any
      # fails, put the previous version straight back.
      - name: Check the live site (rolls back if it is broken)
        if: steps.config.outputs.ready == 'true'
        working-directory: apps/storefront
        run: |
          SITE="${STOREFRONT_BASE_URL%/}"
          DAY=$(TZ=Asia/Qatar date -d '+3 days' +%F)
          ok=1
          for path in en-qa ar-qa en-qa/contact en-qa/terms "en-qa/results?direction=arrival&area=west-bay&date=$DAY&time=12:00&passengers=2&luggage=2"; do
            sep='?'; case "$path" in *\?*) sep='&';; esac
            code=000
            for try in 1 2 3; do
              code=$(curl -s -A 'Mozilla/5.0 deploy-check' --max-time 45 -o page.html -w '%{http_code}' "$SITE/$path${sep}cb=$RANDOM$try") || code=000
              if [ "$code" = 200 ]; then
                case "$path" in
                  *results*) grep -q "Sedan" page.html && ! grep -q "price this trip online" page.html && break; code="200-but-no-fares" ;;
                  *) break ;;
                esac
              fi
              sleep 5
            done
            echo "$code  $SITE/$path"
            [ "$code" = 200 ] || ok=0
          done
          if [ "$ok" = 1 ]; then exit 0; fi
          if [ -n "$PREVIOUS" ]; then
            echo "::error::The new version is failing; rolling back to $PREVIOUS"
            npx wrangler rollback "$PREVIOUS" -y -m "Automatic rollback: deploy check failed"
          else
            echo "::error::The new version is failing and the previous version is unknown — roll back from the Cloudflare dashboard"
          fi
          exit 1
        env:
          STOREFRONT_BASE_URL: ${{ vars.STOREFRONT_BASE_URL }}
          PREVIOUS: ${{ steps.previous.outputs.version }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
