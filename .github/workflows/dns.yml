# One-off DNS maintenance for desertdriverental.com.
#
# Manual only — it has no push or schedule trigger, so it cannot fire on its
# own. It exists because the Cloudflare zone lives in an account only CI holds
# a token for, and two things needed doing there: clearing the old site's
# records so the Worker can bind its custom domain, and adding Resend's records
# so booking confirmations reach customers rather than bouncing.
#
# `list` is the default and changes nothing. Delete this workflow once the
# zone is settled; a deploy pipeline is not where DNS should live.
name: DNS (manual)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "list (safe) | clear-root (delete A/CNAME on apex+www) | add-resend"
        required: true
        default: list
        type: choice
        options: [list, clear-root, add-resend]

jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - name: Run
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          api() { curl -sS -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" "$@"; }
          ZONE=$(api "https://api.cloudflare.com/client/v4/zones?name=desertdriverental.com" \
                 | python3 -c "import json,sys;d=json.load(sys.stdin);print(d['result'][0]['id'] if d.get('success') and d['result'] else '')")
          if [ -z "$ZONE" ]; then
            echo "::error::Could not read the zone. The CI token likely lacks Zone:Read / Zone:DNS on desertdriverental.com."
            api "https://api.cloudflare.com/client/v4/zones?name=desertdriverental.com" | head -c 600; exit 1
          fi
          echo "zone id resolved"

          list() {
            api "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records?per_page=100" \
            | python3 -c "
import json,sys
d=json.load(sys.stdin)
for r in d.get('result',[]):
    print(f\"  {r['type']:6} {r['name']:44} proxied={str(r.get('proxied')):5} {r['content'][:60]}\")
"
          }

          case "$ACTION" in
            list) echo '--- current records ---'; list ;;
            clear-root)
              echo '--- before ---'; list
              api "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records?per_page=100" \
              | python3 -c "
import json,sys
d=json.load(sys.stdin)
keep=('desertdriverental.com','www.desertdriverental.com')
for r in d.get('result',[]):
    if r['type'] in ('A','AAAA','CNAME') and r['name'] in keep:
        print(r['id'], r['type'], r['name'])
" > /tmp/kill.txt
              cat /tmp/kill.txt
              while read -r id t n; do
                [ -z "$id" ] && continue
                echo "deleting $t $n"
                api -X DELETE "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records/$id" | head -c 120; echo
              done < /tmp/kill.txt
              echo '--- after ---'; list ;;
            add-resend)
              add() { api -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records" -d "$1" | python3 -c "
import json,sys
d=json.load(sys.stdin)
print(('  added  ' if d.get('success') else '  FAILED ') + json.dumps(d.get('result') or d.get('errors'))[:160])
"; }
              add '{"type":"TXT","name":"resend._domainkey","content":"p=MIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQDDz10cId8wYFizcQsAQS9MP5K9RdjmYtT9o8ylSkHDwgeZXlV82Y8AxDcHUnXgE6A+DOB5XR5TSfRE6nNF7EGeIOgCu//TSoAZqAbYlWLzObakLhVzHKhp1HpqjDN8Sy1v205CkoG2b1mxWd7g6uca2ZvHPApUBN0EAOivhUreMQIDAQAB","ttl":1}'
              add '{"type":"MX","name":"send","content":"feedback-smtp.eu-west-1.amazonses.com","priority":10,"ttl":1}'
              add '{"type":"TXT","name":"send","content":"v=spf1 include:amazonses.com ~all","ttl":1}'
              add '{"type":"CNAME","name":"rsend","content":"send.forge.rmta.net","proxied":false,"ttl":1}'
              echo '--- after ---'; list ;;
          esac
